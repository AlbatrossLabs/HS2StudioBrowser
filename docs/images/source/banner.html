<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  :root {
    --bg: #0a0d18; --panel: #111827; --border: rgba(255,255,255,.10);
    --text: #e8ecf8; --muted: #8b95b5; --cyan: #22d3ee; --pink: #f472b6; --neon: #6ee7b7;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: transparent; font-family: 'Inter', 'Inter Display', sans-serif; }
  .stage { position: relative; overflow: hidden; background: var(--bg); }

  /* background: faint grid, a cyan glow on the left, a pink one behind her */
  .grid { position: absolute; inset: 0;
    background-image: linear-gradient(rgba(255,255,255,.035) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.035) 1px, transparent 1px);
    background-size: 40px 40px; mask-image: linear-gradient(90deg, rgba(0,0,0,.9), rgba(0,0,0,.25)); }
  .glow { position: absolute; border-radius: 50%; filter: blur(60px); }
  .glow.c { background: rgba(34,211,238,.20); }
  .glow.p { background: rgba(244,114,182,.38); }

  /* wordmark */
  .brand { position: absolute; display: flex; flex-direction: column; }
  .wordmark { display: flex; align-items: center; gap: 18px; }
  .studio { font-family: 'Poppins', sans-serif; font-weight: 800; letter-spacing: -1px; line-height: 1;
    background: linear-gradient(90deg, var(--cyan), #a78bfa 55%, var(--pink)); -webkit-background-clip: text; color: transparent; }
  .plate { display: flex; align-items: center; border: 2px solid var(--neon); border-radius: 14px;
    background: rgba(110,231,183,.08); box-shadow: 0 0 22px rgba(110,231,183,.35), inset 0 0 18px rgba(110,231,183,.12); }
  .browser { font-family: 'Poppins', sans-serif; font-weight: 700; color: var(--neon); letter-spacing: 1px; line-height: 1;
    text-shadow: 0 0 14px rgba(110,231,183,.55); }
  .underline { height: 4px; border-radius: 2px; margin-top: 16px; background: linear-gradient(90deg, var(--cyan), var(--pink)); }
  .tagline { color: var(--text); margin-top: 16px; line-height: 1.35; }
  .tagline b { color: #fff; font-weight: 700; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 18px; }
  .chip { font-size: 15px; font-weight: 600; color: var(--text); padding: 6px 13px; border-radius: 999px;
    border: 1px solid var(--border); background: rgba(255,255,255,.04); }
  .chip.on { color: #0a0d18; background: var(--neon); border-color: var(--neon); }
  .chip.pk { color: #ffd6ea; border-color: rgba(244,114,182,.6); background: rgba(244,114,182,.12); }
  .by { font-size: 13px; letter-spacing: 2.5px; color: var(--muted); font-weight: 600; }
  .by b { color: var(--text); }

  /* the browser screenshot as a floating window */
  .window { position: absolute; border-radius: 14px; overflow: hidden; border: 1px solid rgba(110,231,183,.55);
    box-shadow: 0 0 0 1px rgba(0,0,0,.6), 0 18px 60px rgba(0,0,0,.65), 0 0 40px rgba(110,231,183,.18);
    transform: perspective(1400px) rotateY(-14deg) rotateZ(1.5deg); transform-origin: left center; background: #0d1117; }
  .window img { display: block; width: 100%; }
  .window::after { content: ''; position: absolute; inset: 0;
    background: linear-gradient(115deg, rgba(255,255,255,.10), transparent 35%); pointer-events: none; }

  .girl { position: absolute; filter: drop-shadow(0 0 28px rgba(244,114,182,.45)); }
  .girl img { display: block; width: 100%; -webkit-mask-image: linear-gradient(to bottom, #000 82%, transparent 100%); mask-image: linear-gradient(to bottom, #000 82%, transparent 100%); }

  /* README banner, 1600 x 400 */
  .banner { width: 1600px; height: 400px; }
  .banner .glow.c { width: 520px; height: 300px; left: -120px; top: -80px; }
  .banner .glow.p { width: 420px; height: 420px; right: 20px; top: 10px; }
  .banner .brand { left: 64px; top: 48px; width: 660px; }
  .banner .studio { font-size: 80px; }
  .banner .plate { height: 76px; padding: 0 20px; }
  .banner .browser { font-size: 54px; }
  .banner .underline { width: 360px; }
  .banner .tagline { font-size: 21px; }
  .banner .by { position: absolute; left: 64px; bottom: 26px; }
  .banner .girl { width: 300px; right: 34px; top: 6px; }
  .banner .window { width: 420px; left: 790px; top: 44px; }

  /* Social preview, 1280 x 640 */
  .social { width: 1280px; height: 640px; }
  .social .glow.c { width: 560px; height: 380px; left: -140px; top: -100px; }
  .social .glow.p { width: 560px; height: 620px; right: -40px; top: 40px; }
  .social .brand { left: 64px; top: 62px; width: 720px; }
  .social .studio { font-size: 100px; }
  .social .plate { height: 96px; padding: 0 24px; }
  .social .browser { font-size: 70px; }
  .social .underline { width: 440px; }
  .social .tagline { font-size: 25px; max-width: 640px; }
  .social .chips { max-width: 660px; }
  .social .by { position: absolute; left: 64px; bottom: 34px; }
  .social .girl { width: 460px; right: 10px; top: 8px; }
  .social .window { width: 290px; left: 548px; top: 372px; transform: perspective(1400px) rotateY(-10deg) rotateZ(-2deg); }

  /* Social post, 3:2, 1200 x 800 */
  .social32 { width: 1200px; height: 800px; }
  .social32 .glow.c { width: 600px; height: 420px; left: -160px; top: -110px; }
  .social32 .glow.p { width: 620px; height: 760px; right: -70px; top: 50px; }
  .social32 .brand { left: 64px; top: 70px; width: 660px; }
  .social32 .studio { font-size: 96px; }
  .social32 .plate { height: 92px; padding: 0 22px; }
  .social32 .browser { font-size: 66px; }
  .social32 .underline { width: 420px; }
  .social32 .tagline { font-size: 26px; max-width: 600px; }
  .social32 .chips { max-width: 720px; }
  .social32 .by { position: absolute; left: 64px; bottom: 30px; }
  .social32 .girl { width: 560px; right: 14px; top: 24px; }
  .social32 .window { width: 300px; left: 120px; top: 392px; transform: perspective(1400px) rotateY(-10deg) rotateZ(-2deg); }
</style>
</head>
<body>
<div id="root"></div>
<script>
const layout = new URLSearchParams(location.search).get('layout') || 'banner';
const chips = `
  <div class="chips">
    <div class="chip on">Outfits</div><div class="chip">Characters</div><div class="chip">Scenes</div>
    <div class="chip">Poses</div><div class="chip">Animations</div><div class="chip">Items</div><div class="chip">Maps</div>
    <div class="chip pk">Tags · Ratings · Duplicates</div>
  </div>`;
const brand = (tag) => `
  <div class="brand">
    <div class="wordmark"><div class="studio">STUDIO</div><div class="plate"><div class="browser">BROWSER</div></div></div>
    <div class="underline"></div>
    <div class="tagline">${tag}</div>
    ${chips}
  </div>`;
const by = `<div class="by">HONEY SELECT 2 STUDIO PLUGINS · <b>ALBATROSS LABS</b></div>`;
document.getElementById('root').innerHTML = `
  <div class="stage ${layout}">
    <div class="grid"></div><div class="glow c"></div><div class="glow p"></div>
    ${brand(layout === 'banner'
      ? 'Pictures, folders, search and tags for everything<br>in <b>Honey Select 2 Studio</b>.'
      : 'Pictures, folders, search and tags for everything in your <b>Honey Select 2 Studio</b> library.')}
    <div class="girl"><img src="bunny.png"></div>
    <div class="window"><img src="shot.png"></div>
    ${by}
  </div>`;
</script>
</body>
</html>
